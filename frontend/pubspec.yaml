name: ocean_view_resort_app
description: Ocean View Resort Booking System - Flutter Frontend
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests
  http: ^1.1.0

  # State management
  provider: ^6.0.0

  # Local storage
  shared_preferences: ^2.2.0

  # Date/Time picker and formatting
  intl: ^0.18.0

  # JSON serialization (not strictly required yet, but ready)
  json_annotation: ^4.8.0

  # Beautiful UI fonts
  google_fonts: ^5.1.0

  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  build_runner: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
